[package]
name = "generalzip-native"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "GeneralZip 的 Rust 原生核心：7z 读写（含 AES-256 加密）、RAR 解密读取、xz 编解码（C ABI）"

[lib]
name = "generalzip_native"
crate-type = ["cdylib"]

[features]
default = []
# RAR 支持（unrar crate，需要 C++ 工具链构建 vendored unrar 源码）
rar = ["dep:unrar"]

[dependencies]
sevenz-rust2 = { version = "0.7", features = ["aes256", "compress"] }
lzma-rs = "0.3"
lzma-rust2 = "0.1"
lz4_flex = "0.14"
ruzstd = "0.9"
rust-zstd = "0.4"
# bzip2 ≥0.6 默认后端即 libbz2-rs-sys（c2rust 转译的纯 Rust libbz2），无 C 工具链依赖
bzip2 = "0.6"
unrar = { version = "0.5", optional = true }

[profile.release]
opt-level = 3
lto = true
strip = true
