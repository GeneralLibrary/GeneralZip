name: Release

# Triggered by pushing a version tag, e.g. v1.1.0
#   git tag v1.1.0 && git push origin v1.1.0
#
# Pipeline: RID matrix native build → pack NuGet (with native cores inside
# GeneralZip.Native) → run smoke tests → publish to NuGet.org → GitHub Release.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # GitHub Release creation

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # 1) Build the native core for every RID
  # ------------------------------------------------------------------
  native-core:
    name: native core (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            target: x86_64-pc-windows-gnu
            use-shim: true
          - rid: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use-shim: false
          - rid: linux-musl-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use-shim: false
          - rid: osx-x64
            os: macos-latest
            target: x86_64-apple-darwin
            use-shim: false
          - rid: osx-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            use-shim: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/generalzip-native
          key: release-${{ matrix.rid }}

      - name: Build (windows-gnu needs the dlltool shim)
        if: matrix.use-shim
        shell: pwsh
        run: |
          cargo build --release --target ${{ matrix.target }} --manifest-path native/dlltool-shim-rs/Cargo.toml
          $env:RUSTFLAGS = "-C dlltool=" + (Resolve-Path "native/dlltool-shim-rs/target/release/gzdlltool.exe")
          cargo build --release --target ${{ matrix.target }} --manifest-path native/generalzip-native/Cargo.toml

      - name: Build
        if: ${{ !matrix.use-shim }}
        run: cargo build --release --target ${{ matrix.target }} --manifest-path native/generalzip-native/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: native-core-${{ matrix.rid }}
          path: |
            native/generalzip-native/target/${{ matrix.target }}/release/*.dll
            native/generalzip-native/target/${{ matrix.target }}/release/*.dylib
            native/generalzip-native/target/${{ matrix.target }}/release/*.so

  # ------------------------------------------------------------------
  # 2) Pack NuGet packages with all RID cores embedded
  # ------------------------------------------------------------------
  pack:
    name: pack NuGet
    runs-on: windows-latest
    needs: [ native-core ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download all native cores
        uses: actions/download-artifact@v4
        with:
          pattern: native-core-*
          path: artifacts

      - name: Deploy cores into runtimes/<RID>/native
        shell: pwsh
        run: |
          $rids = @('win-x64','linux-x64','linux-musl-x64','osx-x64','osx-arm64')
          foreach ($rid in $rids) {
            $dest = "src/GeneralZip.Native/runtimes/$rid/native"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item "artifacts/native-core-$rid/*" $dest -Force
          }
          Get-ChildItem -Recurse src/GeneralZip.Native/runtimes | Select-Object FullName, Length

      - name: Set version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build + pack
        run: |
          dotnet build GeneralZip.slnx -c Release -p:Version=${{ env.PACKAGE_VERSION }} --nologo
          dotnet pack src/GeneralZip/GeneralZip.csproj -c Release -p:Version=${{ env.PACKAGE_VERSION }} -o artifacts/nuget --nologo
          dotnet pack src/GeneralZip.Native/GeneralZip.Native.csproj -c Release -p:Version=${{ env.PACKAGE_VERSION }} -o artifacts/nuget --nologo

      - name: Smoke test (install packed GeneralZip.Native into a fresh console app)
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP "smoke"
          dotnet new console -o $smoke --force
          Push-Location $smoke
          dotnet add package GeneralZip --source "$(Resolve-Path ../artifacts/nuget)" --no-restore
          dotnet add package GeneralZip.Native --source "$(Resolve-Path ../artifacts/nuget)" --no-restore
          Set-Content -Path Program.cs -Value @'
          using GeneralZip;
          using GeneralZip.Native;
          using static GeneralZip.GeneralZip;

          Initialize();
          Console.WriteLine($"native={GeneralZipNative.Initialize()}");

          var dir = Path.Combine(Path.GetTempPath(), "gzp-smoke");
          if (Directory.Exists(dir)) Directory.Delete(dir, true);
          Directory.CreateDirectory(dir);
          var zip = Path.Combine(dir, "t.zip");
          using (var w = ArchiveWriter.CreateNew(zip, formatName: "7Z"))
          {
              var payload = System.Text.Encoding.UTF8.GetBytes("release smoke test");
              w.AddStream("t.txt", new MemoryStream(payload), payload.Length);
              w.Finish();
          }
          using var r = ArchiveReader.Open(zip);
          using var s = r.OpenEntryStream(r.Entries[0]);
          using var ms = new MemoryStream();
          s.CopyTo(ms);
          if (ms.Length != 19) throw new System.Exception("smoke failed");
          Console.WriteLine("SMOKE OK");
          '@ -Encoding utf8
          dotnet run -c Release
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nuget/*

  # ------------------------------------------------------------------
  # 3) Publish to NuGet.org + create the GitHub Release
  # ------------------------------------------------------------------
  publish:
    name: publish + GitHub Release
    runs-on: ubuntu-latest
    needs: [ pack ]
    environment: nuget

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nuget

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push "artifacts/nuget/*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GeneralZip ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
