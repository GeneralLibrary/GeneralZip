name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # 1) Rust native core: build every RID matrix + upload as artifacts
  # ------------------------------------------------------------------
  native-core:
    name: native core (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            target: x86_64-pc-windows-gnu      # matches repo default (no MSVC needed)
            use-shim: true
          - rid: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use-shim: false
          - rid: linux-musl-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use-shim: false
          - rid: osx-x64
            os: macos-latest
            target: x86_64-apple-darwin
            use-shim: false
          - rid: osx-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            use-shim: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/generalzip-native
          key: ${{ matrix.rid }}

      - name: Configure CN mirrors (best-effort)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "RUSTUP_DIST_SERVER=https://rsproxy.cn`nRUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build (windows-gnu needs the dlltool shim for raw-dylib)
        if: matrix.use-shim
        shell: pwsh
        run: |
          cargo build --release --target ${{ matrix.target }} --manifest-path native/generalzip-native/Cargo.toml
          # Build the dlltool shim and re-run with it (raw-dylib import libs)
          cargo build --release --manifest-path native/dlltool-shim-rs/Cargo.toml
          $env:RUSTFLAGS = "-C dlltool=" + (Resolve-Path "native/dlltool-shim-rs/target/release/gzdlltool.exe")
          cargo build --release --target ${{ matrix.target }} --manifest-path native/generalzip-native/Cargo.toml

      - name: Build
        if: ${{ !matrix.use-shim }}
        run: cargo build --release --target ${{ matrix.target }} --manifest-path native/generalzip-native/Cargo.toml

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.rid }}
          case "${{ matrix.os }}" in
            windows-*) ext=dll ;;
            macos-*)   ext=dylib ;;
            *)         ext=so ;;
          esac
          cp "native/generalzip-native/target/${{ matrix.target }}/release/libgeneralzip_native.$ext" \
             dist/${{ matrix.rid }}/generalzip_native.$ext 2>/dev/null || \
          cp "native/generalzip-native/target/${{ matrix.target }}/release/generalzip_native.$ext" \
             dist/${{ matrix.rid }}/generalzip_native.$ext
          ls -la dist/${{ matrix.rid }}/

      - uses: actions/upload-artifact@v4
        with:
          name: native-core-${{ matrix.rid }}
          path: dist/${{ matrix.rid }}/*

  # ------------------------------------------------------------------
  # 2) Managed: build + test (net8.0; native tests auto-skip without core)
  # ------------------------------------------------------------------
  managed:
    name: managed tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (netstandard2.0 + net8.0)
        run: dotnet build GeneralZip.slnx -c Release --nologo

      - name: Test (core)
        run: dotnet test tests/GeneralZip.Tests/GeneralZip.Tests.csproj -c Release --nologo

      - name: Test (native binding; skipped without core)
        run: dotnet test tests/GeneralZip.Native.Tests/GeneralZip.Native.Tests.csproj -c Release --nologo

  # ------------------------------------------------------------------
  # 3) Integration: managed tests WITH the native core (windows-x64)
  # ------------------------------------------------------------------
  integration:
    name: integration tests (native core present)
    runs-on: windows-latest
    needs: [ native-core, managed ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v4
        with:
          name: native-core-win-x64
          path: native-core

      - name: Deploy native core for tests
        shell: pwsh
        run: |
          $dest = "tests/GeneralZip.Native.Tests/bin/Release/net8.0"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item native-core/generalzip_native.dll $dest/

      - name: Build (Release)
        run: dotnet build tests/GeneralZip.Native.Tests/GeneralZip.Native.Tests.csproj -c Release --nologo

      - name: Test (native core exercised: 7z/BZ2/XZ/ZSTD/LZ4/RAR paths)
        run: dotnet test tests/GeneralZip.Native.Tests/GeneralZip.Native.Tests.csproj -c Release --nologo
